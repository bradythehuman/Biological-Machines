biological-machines-planet-wit=Biological Machines: Planet Wit

[mod-description]
biological-machines-planet-wit=Добавляет Wit — спутник Наувиса, покрытый астероидными кратерами, стеклом, гелием и сульфатом меди. Используйте эти ресурсы для производства гелиевых элементов питания, необходимых для космических исследовательских пакетов, лазерных турелей и завода робототехники. Завод необходим для изготовления сборщиков астероидов; его базовая продуктивность — 50%. Вернитесь после освоения Аквило за межзвёздными исследовательскими пакетами.
