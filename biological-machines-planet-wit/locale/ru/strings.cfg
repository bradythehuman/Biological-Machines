bm-planet-discovery-wit=Отправляйтесь на Wit для производства космических исследовательских пакетов. Устройства, сжигающие топливо, не работают в разреженной атмосфере Wit. Чтобы начать производство, привезите хотя бы солнечную панель, опору ЛЭП и электрическую печь.

