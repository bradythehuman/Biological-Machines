[mod-name]
biological-machines-shattered-core=Biological Machines: Shattered Core

[mod-description]
biological-machines-shattered-core=Добавляет небольшую планету в космической локации разрушенной планеты, где можно производить прометиевые исследовательские пакеты. Вся поверхность покрыта прометиевой рудой и электросетью с бесплатной электроэнергией.
