[space-location-description]
bm-dyson-sphere=Кольцевая станция, которая собирает и распределяет часть энергии звезды, пока продолжается строительство полной сферы Дайсона. Обменивайте строительные материалы на кредиты для покупки товаров на рынке.
bm-new-system=Множество далёких звёздных систем, богатых ресурсами и обнаруженных зондами, которые давным-давно отправились из вашего родного мира. Дистанционно отправьте в такую систему космическую платформу с клоном в анабиозе для основания колонии. ВНИМАНИЕ: платформа будет удалена, а кредиты поступят на станцию строительства сферы Дайсона.

