intro-message=Добро пожаловать в Biological Machines! Вы — клон-инженер, отправленный на корабле с системой анабиоза для колонизации далёкой звёздной системы. Постройте космическую платформу, способную к межзвёздным путешествиям, и вернитесь в родной мир с необходимыми строительными материалами.
dyson-sphere-discovery-trigger=Достигните внутренней границы поля планетарных обломков в родной системе, чтобы обнаружить станцию строительства сферы Дайсона.
dyson-sphere-discovery-message=С возвращением в родную систему, CE-7567! Это автоматическое сообщение центрального компьютера станции строительства сферы Дайсона. Вам назначен отсек 327. Не покидайте свой отсек, иначе рискуете внезапно погибнуть. Клоны-инженеры мутировали в кусак, и для их нейтрализации были задействованы обслуживающие дроиды.

victory-title=Победа!
victory-message=[font=default-bold]Поздравляем! Вы создали себе замену![/font]\n\nВы отправили ещё одного клона-инженера через межзвёздное пространство для колонизации далёкой звёздной системы, заново запустив цикл, который начался с вашей отправки на Наувис. В каком-то смысле ничего не изменилось: как и вы, этот клон начнёт с нуля и будет развиваться, пока не сможет привезти домой ещё больше строительных материалов. Однако за время вашего отсутствия родная звёздная система сильно изменилась. Ваш родной мир разрушили и разобрали на ресурсы, чтобы начать строительство сферы Дайсона. К вашему возвращению уже появилась станция, способная производить электроэнергию, но для завершения полной сферы по-прежнему нужно больше ресурсов, чем может добыть один инженер, каким бы эффективным он ни был.\n\nВозможно, только что отправленный вами клон вернётся в далёком будущем как раз вовремя, чтобы завершить строительство сферы. Но что потом? Будучи клоном-инженером, вы — биологическая машина, созданная для обслуживания всей промышленности родного мира. Но кому служат эти заводы? Не кусакам, которые полностью отказались от технологий. И не классу собственников вашего родного мира: они финансировали промышленное развитие, но, ослеплённые жадностью, по-видимому, уничтожили себя вместе со своей планетой. Возможно, вместо этого только что отправленный вами клон покинет стройку и возьмёт под контроль промышленность родного мира, заставив её служить потребностям жизни, а не наоборот.\n\nВы можете продолжать расширять и оптимизировать свои фабрики сколько угодно. На станцию строительства сферы Дайсона поступило __1__ кредитов. Столько же будет выплачиваться каждый раз, когда вы отправите ещё одного клона в анабиозе для колонизации далёкой звёздной системы.
victory-final=Спасибо за игру в Biological Machines от bradythehuman. Мира и любви всему живому.

