[technology-description]
bm-solar-system-discovery-homeworld=Выполнив задание по созданию промышленной колонии в далёком мире, вы вновь находите родную звёздную систему спустя десятки тысяч лет. Ваш родной мир разрушен и превратился в поле планетарных обломков. Вы не знаете, сохранилась ли в системе цивилизация и куда доставить строительные материалы, которые вам поручили собрать.
bm-dyson-sphere-discovery=После отлёта инженера его родной мир разрушили и переработали в строительные материалы, чтобы начать возведение сферы Дайсона. Тысячи лет спустя, когда бесчисленное множество других клонов-инженеров вернулись с ресурсами из далёких промышленных колоний, завершили лишь начальную кольцевую станцию. Она предназначена для сбора и распределения части энергии звезды, пока продолжается строительство полной сферы. Высадитесь на строительное кольцо и сдавайте ресурсы для продолжения строительства, получая оплату в кредитах.
bm-solar-system-discovery-new=Отправьте клона-инженера на космической платформе в далёкую звёздную систему, чтобы основать колонию и со временем доставить ресурсы в родную систему для продолжения строительства сферы Дайсона. Вы не сможете управлять новой колонией, но получите оплату в кредитах на строительной станции.

