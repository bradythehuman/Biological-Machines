biological-machines-homeworld=Давным-давно инженера отправили колонизировать далёкую звёздную систему. Используйте варп-двигатель, чтобы вернуться к родной звезде со строительными материалами. Высадитесь на станции строительства сферы Дайсона и обменивайте материалы на кредиты, которые можно потратить на станционных рынках. Завершите новую сюжетную линию, чтобы получить награду в кредитах.
