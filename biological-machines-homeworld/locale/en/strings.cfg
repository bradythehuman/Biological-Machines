[space-location-description]
bm-dyson-sphere=A ring shaped station which collects/distributes some solar energy while constructing the full Dyson sphere. Exchange construction materials for credits to buy products from the market.
bm-new-system=Many distant, resource rich solar systems identified by probes sent from your Homeworld long ago. Remotely send a space platform with a suspended clone to the system to establish a colony. WARNING: The platform will be removed and credits will be paid out on the Dyson sphere construction platform.

