[technology-description]
bm-solar-system-discovery-homeworld=After completing your assignment of establishing a factory colony on a distant world, you rediscover your home solar system tens of thousands of years later to find your Homeworld shattered into a field of planetary debris. You are unsure if there is any civilization left in the system or where to bring the construction materials you were assigned to collect.
bm-dyson-sphere-discovery=Since the Engineer left, their Homeworld was shattered to be processed into construction materials to begin construction on a Dyson sphere. Thousands of years later, after countless other clone Engineers returned with resources from distant factory colonies, only an initial ring station has been completed designed to collect and distribute a portion of the stars energy while constructing the full sphere. Land on the construction ring and deposit resources to further it's construction and receive payment in credits.
bm-solar-system-discovery-new=Send a clone Engineer via space platform to a distant solar system to establish a colony and eventually bring resources back to your home system to further construction on the Dyson sphere. You have no control over the new colony but do receive a payment in credits on the construction station

