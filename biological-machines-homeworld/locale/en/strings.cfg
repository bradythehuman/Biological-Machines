intro-message=Welcome to Biological Machines! You are a clone Engineer sent on a sleeper ship to colonize a distant star system. Build a space platform capable of interstellar travel and return to your Homeworld with needed construction materials.
dyson-sphere-discovery-trigger=Reach the inner edge of your Home systems planetary debris field to discover the Dyson sphere construction station.
dyson-sphere-discovery-message=Welcome back to your home system CE-7567, this is an automated message from the Dyson sphere construction platform's central computer. You have been assigned bay 327, stay in your bay or risk spontaneous death. Clone Engineers have mutated into biters and maintenance droids have been deployed to neutralize them.

victory-title=Victory!
victory-message=[font=default-bold]Congratulations on replacing yourself![/font]\n\nYou have sent another clone Engineer through interstellar space to colonize a distant solar system, restarting the cycle which began when you where send to Nauvis. In a sense nothing has changed, like you this clone will work their way up from nothing until they can bring more construction materials home. However, while you were gone, your home solar system changed a lot. Your Homeworld was shattered and harvested for resources to begin construction on a Dyson sphere. By the time you returned there was a station capable of producing power but construction of the full sphere still requires more resources than any individual engineer could, regardless of their efficiency.\n\nPerhaps the clone you have just sent out will return far in the future, just in time to complete the sphere's construction, but then what. As a clone Engineer, you are a biological machine made to serve the collective industry of your Homeworld but who do those factories serve. Not the biters who have abandoned technology entirely. And not the ownership class on your Homeworld who funded industrial development but, blinded by their greed, appear to have destroyed themselves along with their planet. Perhaps the clone you have just sent out will instead walk away from the construction project and seize control of your Homeworld's industry, forcing it to serve the need of life instead of the reverse.\n\nYou can continue to expand and optimize your factories as long as you like. __1__ credits were deposited on the Dyson sphere construction platform and the same amount will be paid every time you send another suspended clone to colonize a distant solar system.
victory-final=Thanks for playing Biological Machines by bradythehuman. Peace and love to all life.

