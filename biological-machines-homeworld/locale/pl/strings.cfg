[space-location-description]
bm-dyson-sphere=Niedokończona, ale działająca sfera Dysona. Zdeponuj materiały budowlane (w zielonej skrzyni), aby otrzymać kredyty (w złotej skrzyni) i kupić inne materiały na rynku.
bm-new-system=Macierzysta planeta zidentyfikowała wiele nieosiedlonych światów. Wyślij zdalnie do tego układu platformę kosmiczną z zamrożonym klonem w celu założenia kolonii. OSTRZEŻENIE: Platforma zostanie usunięta, a kredyty zostaną wypłacone na platformie budowlanej sfery Dysona.

