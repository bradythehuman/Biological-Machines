[bm]
market-recipe-suffix= za kredyty
intro-msg=Witamy w grze „Biological Machines”! Jesteś klonowanym robotnikiem wysłanym statkiem hibernetycznym w celu skolonizowania niezamieszkanego układu gwiezdnego. Zbuduj platformę kosmiczną zdolną do podróży międzygwiezdnych i wróć na swoją rodzinną planetę z materiałami potrzebnymi do skonstruowania sfery Dysona.
victory-title=Zwycięstwo!
victory-message=[font=default-bold]Gratulacje!\nUkończyłeś grę, wysyłając klona na międzygwiezdną platformę kosmiczną w celu skolonizowania nowego świata![/font]\n\nMożesz kontynuować grę na tym poziomie tak długo, jak chcesz. __1__ kredytów zostało zdeponowanych na platformie budowlanej sfery Dysona, a taka sama kwota będzie wypłacana za każdym razem, gdy kolejny klon zostanie wysłany w celu skolonizowania nowego świata.
victory-final=Dziękujemy za grę.\nbradythehuman
final-platform-removed=[space-platform=__1__] została usunięta, ponieważ zakończyła swoją podróż do [space-location=bm-new-system]
final-platform-returned=[space-platform=__1__] została zwrócona do [space-location=solar-system-edge]
player-on-final-platform=Gracze nie mogą udać się w podróż do [space-location=bm-new-system]
no-clone-on-final-platform=Zawieszony klon musi zostać wysłany w podróż do [space-location=bm-new-system]
