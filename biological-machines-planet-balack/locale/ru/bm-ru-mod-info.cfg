[mod-name]
biological-machines-planet-balack=Biological Machines: Planet Balack

[mod-description]
biological-machines-planet-balack=Добавляет Balack — планету, доступную после Аквило, с новым металлоломом, нефтяным шламом и сильными врагами. Единственный биофабрикатор можно разместить в точке появления. Он необходим для производства новых промежуточных и конечных продуктов, включая новый модуль, ценой огромного загрязнения. Промежуточные продукты используются для изготовления танка МК2, меха-брони МК2 и варп-двигателя.
