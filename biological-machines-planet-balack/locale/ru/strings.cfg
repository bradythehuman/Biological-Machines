[entity-description]
bm-bio-cube=Можно разместить только на Balack, на единственном участке зелёного бассейна в точке появления (между 4 аттракторами). Для расширения производства необходимо ускорять этот единственный биофабрикатор и менять его рецепт сигналами логической сети.
bm-balack-ruin-vault=Неуязвимый улей, порождающий все виды врагов Balack. Появляется только дальше 375 клеток от точки появления.

