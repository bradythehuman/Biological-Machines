[mod-name]
biological-machines-radioactive-tissue=Biological Machines: Radioactive Tissue

[mod-description]
biological-machines-radioactive-tissue=Добавляет ткань, выпадающую из ульев кусак. Её можно культивировать в биокамере с помощью биофлюса и урана-235. Ткань используется для производства ядерного военного исследовательского пакета, различных устройств, включая новый военный сборочный автомат с базовой продуктивностью 50%, яда, урановой руды в центрифуге и клонов.
