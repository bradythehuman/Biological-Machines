[mod-name]
biological-machines-warp-drive=Biological Machines: Warp Drive

[mod-description]
biological-machines-warp-drive=Добавляет варп-двигатель, который расходует элементы питания варп-двигателя для мгновенного перемещения космической платформы в следующую космическую локацию. Для телепортации платформа должна двигаться вперёд.
