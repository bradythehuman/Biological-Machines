[mod-name]
biological-machines-cloning=Biological Machines: Cloning

[mod-description]
biological-machines-cloning=Клонов можно создавать в биокамере и хранить в специальных капсулах анабиоза. Вход инженера в капсулу заполняет её и открывает меню возрождения, где можно выбрать любую заполненную капсулу или обычную точку появления. У клонов более высокого качества больше здоровья и выше скорость передвижения, создания предметов и добычи ресурсов.
