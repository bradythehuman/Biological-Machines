[mod-description]
biological-machines-modpack=Biological Machines — глобальная переработка Space Age, посвящённая как обычным, так и научно-фантастическим биологическим процессам. Эта сборка представляет задуманный автором игровой опыт Biological Machines, хотя содержит только зависимости. Любую из них можно исключить по предпочтениям или ради совместимости.
