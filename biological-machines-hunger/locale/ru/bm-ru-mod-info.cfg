[mod-name]
biological-machines-hunger=Biological Machines: Hunger

[mod-description]
biological-machines-hunger=Добавляет механику голода: инженер автоматически ест выбранную пищу из своего инвентаря, а без неё голодает. Пока пища усваивается, её вид определяет пассивные бонусы или штрафы к восстановлению здоровья и скорости передвижения. Также добавляет снаряжение, позволяющее не голодать, и другие возможности.
