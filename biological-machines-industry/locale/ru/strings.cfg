[mod-setting-description]
bm-deep-crude-oil=Уменьшает выход обычных нефтяных месторождений, которые теперь появляются только на грунте и траве Наувиса и на Аквило. Добавляет глубинные месторождения с повышенным выходом, которые появляются только на песке.
bm-rocket-parts=Детали ракеты производятся вне ракетных шахт с использованием защитных материалов, зависящих от планеты. Вдохновлено модом от ShaneS15_ и несовместимо с ним.
bm-complex-science=Немного изменяет и усложняет производство производственных, сельскохозяйственных, металлургических и электромагнитных исследовательских пакетов.
bm-boompuff-agriculture=Позволяет выращивать хлопушки на Глебе и использовать их газ для производства гранат, взрывчатки и напалма (топлива для огнемёта). Также добавляет новые ёмкости с топливом для огнемёта. Вдохновлено модом от LordMiguel и несовместимо с ним.
bm-rails-from-landfill=В рецепте рельсов вместо камня используется отсыпка территории.
bm-early-heating-tower=Открывает нагревательную башню после бетона, но до ядерного реактора.

