bm-crushing-industry-override=Изменения Crushing Industry

[mod-setting-description]
bm-crushing-industry-override=Необязательные изменения рецептов и технологий для интеграции Crushing Industry в Biological Machines. ВНИМАНИЕ: параметр «Бетонная смесь» отключается независимо от этого параметра.
bm-crushing-industry-k2=Включите либо этот параметр, либо «Изменения Crushing Industry» из модуля «Biological Machines: Industry», но не оба одновременно.
