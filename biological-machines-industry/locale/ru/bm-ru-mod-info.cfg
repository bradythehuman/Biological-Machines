[mod-name]
biological-machines-industry=Biological Machines: Industry

[mod-description]
biological-machines-industry=Добавляет новые биологические материалы и промежуточные продукты в базовые рецепты, включая рецепты стальных балок, электросхем, бетона и взрывчатки. Для этого переносит в раннюю игру на Наувисе несколько механик Space Age: порчу предметов, переработку, дробление и сельское хозяйство. Также существенно расширяет производство на Глебе, добавляя напалм и биодизель.
