[mod-setting-name]
bm-aai-loader-override=Изменения AAI Loader

[mod-setting-description]
bm-aai-loader-override=Изменяет рецепты и дерево технологий погрузчиков AAI. В настройках AAI выберите режим со смазкой или дорогой режим: рецепты будут одинаковыми, но в режиме со смазкой погрузчики расходуют смазочную жидкость.
