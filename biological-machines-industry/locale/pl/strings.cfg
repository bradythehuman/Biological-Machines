[mod-setting-description]
bm-deep-crude-oil=Zmniejsza procentową wartość dla zwykłych pól naftowych (które teraz pojawiają się wyłącznie na glebie/trawie nauvis oraz na aquilo) i dodaje głębokie pola (o wartości procentowej większej niż zwykłe), które pojawiają się wyłącznie na piasku.
bm-rocket-parts=Części rakietowe są wytwarzane poza silosami przy użyciu osłon specyficznych dla danej planety. Inspirowane modem ShaneS15_, z którym są niekompatybilne.
bm-complex-science=Nieznacznie zmienia/zwiększa złożoność pakietów dotyczących produkcji, rolnictwa, metalurgii oraz nauk elektromagnetycznych.
bm-boompuff-agriculture=Umożliwia uprawę roślin bompuf na glebie i wykorzystanie wydzielanego przez nie gazu do produkcji granatów, materiałów wybuchowych oraz napalmu (paliwa do miotacza ognia). Dodaje również nowe pojemniki z amunicją do miotacza ognia. Inspirowane modem LordMiguel, z którym jest niekompatybilne.
bm-rails-from-landfill=Przepis na szyny wykorzystuje wypełnienia zamiast kamienia
bm-early-heating-tower=Odblokowuje wieżę grzewczą po betonie i przed reaktorem jądrowym

